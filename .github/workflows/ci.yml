name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check the Worker
        run: node --check worker/src/worker.js

      - name: No credential file is tracked
        run: |
          if git ls-files | grep -Ei '(\.pem|\.key|\.env|\.dev\.vars|service[-_]account.*\.json)$'; then
            echo "::error::a credential file is tracked in git"
            exit 1
          fi
